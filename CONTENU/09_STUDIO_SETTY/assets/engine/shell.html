      <div id="flash" data-slot="flash"></div>

      /*DATA*/
      window.DATA = DATA;
    </script>
    <script type="module">
      import { createReel } from "./assets/engine/engine.js";
      import * as kit from "./assets/engine/props.js";

      /*CARD_IMPORTS*/
      import { dialogue } from "./assets/engine/dialogue.js";

      const st = { ...stage/*CARD_NAMES*/ }; // the stage modules + this reel's own cards (assets/engine/card_<name>.js)

      const { KC, faceC, shotTo } = R; // layout "set": the coach's acting and the shot / reverse-shot camera
      const LINES = R.DATA.lines || []; // dialogue reels: { id, who, t, end } per line
      const D = R.DATA.layout === "set" ? dialogue(R) : null; // line(), reaction(), side(), punch() (assets/engine/dialogue.js)
      const { HOOK, MID, TOP, END, STAGE } = CAMS;
      const T = (i) => R.DATA.words[i].t, E = (i) => R.DATA.words[i].end; // start / end of word i

      /*SCENES*/

      window.__timelines = window.__timelines || {};
      window.__timelines["{{ID}}"] = R.start();
    </script>
