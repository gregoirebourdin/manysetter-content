<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.module.js",
                     "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.2/examples/jsm/" } }
    </script>
    <style>
      @font-face { font-family: "Nohemi"; font-weight: 600; src: url("assets/fonts/Nohemi-600.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 100 900; src: url("assets/fonts/Inter-var.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #161a26; }
      #root { position: relative; width: 100%; height: 100%; }
      #three { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .hook { position: absolute; left: 20px; right: 20px; top: 250px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
      .hook .l { display: inline-block; background: #fff; color: #121110; font: 800 58px/1.08 Inter, sans-serif; letter-spacing: -0.035em;
        padding: 0.14em 0.36em 0.2em; border-radius: 0.36em; box-shadow: 0 22px 46px -18px rgba(0, 0, 0, 0.8); white-space: nowrap; }
      .hook .l b { color: #ff611d; }
      .cap { position: absolute; left: 80px; right: 80px; top: 1200px; text-align: center; font: 600 96px/1.04 Nohemi, sans-serif;
        letter-spacing: -0.045em; color: #fff; -webkit-text-stroke: 14px #0d0c0a; paint-order: stroke fill; text-shadow: 0 10px 0 #0d0c0a; opacity: 0; }
      .cap b { color: #ff7a3a; font-weight: 600; }
      .card { position: absolute; top: 560px; width: 520px; height: 420px; border-radius: 34px; background: rgba(255,255,255,0.92);
        box-shadow: 0 30px 60px -20px rgba(0,0,0,0.6); opacity: 0; font: 800 54px/1.1 Inter, sans-serif; color: #111; padding: 40px; }
      .tag { position: absolute; left: 30px; bottom: 30px; font: 700 34px Inter, sans-serif; color: #fff; background: rgba(0,0,0,0.55); padding: 8px 16px; border-radius: 12px; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="boardroom" data-start="0" data-duration="11" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="three"></canvas>
      <div class="hook"><span class="l">Why your <b>DM ads</b> flopped,</span><span class="l">even with <b>300</b> conversations started</span></div>
      <div class="card" id="card">card</div>
      <div class="cap" id="c0">You paid <b>Meta</b> to fill your DMs?</div>
      <div class="cap" id="c1">Look at <b>that!</b></div>
      <div class="cap" id="c2">How many got an <b>answer?</b></div>
      <div class="cap" id="c3">Not who got an <b>answer.</b></div>
      <div class="cap" id="c4">I <b>take over.</b></div>
      <div class="cap" id="c5"></div>
      <div class="cap" id="c6"></div>
      <div class="cap" id="c7"></div>
      <div class="cap" id="c8"></div>
      <div class="cap" id="c9"></div>
      <div class="cap" id="c10"></div>
      <div class="tag" id="tag"></div>
    </div>
    <script type="module">
      import * as THREE from "three";
      import { createSetty, pose as sPose } from "./assets/setty/setty.js";
      import { createCoach, pose as cPose, basePose as cBase } from "./assets/coach/coach.js";
      import { build } from "./assets/sets/boardroom.js";
      import { shot } from "./assets/sets/kit.js";

      const W = 1080, H = 1920;
      document.querySelectorAll(".hook .l").forEach((el) => {
        el.style.fontSize = "100px";
        el.style.fontSize = `${Math.min(120, Math.floor((100 * 1020) / el.offsetWidth))}px`;
      });
      const hook = document.querySelector(".hook");
      const tb = hook.offsetTop + hook.offsetHeight;
      const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("three"), antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(W, H, false);
      renderer.setPixelRatio(1);
      const scene = new THREE.Scene();
      const set = await build({ renderer, scene });
      const coach = createCoach(), setty = createSetty();
      scene.add(coach.root, setty.root);
      const camera = new THREE.PerspectiveCamera(40, W / H, 0.5, 200);
      // aim the close-ups like the engine does: at the real head (+ beanie) and Setty's face
      coach.apply(Object.assign(cBase(), set.coach));
      setty.apply(Object.assign(sPose("smug"), set.setty));
      scene.updateMatrixWorld(true);
      const cT = coach.head.getWorldPosition(new THREE.Vector3()).add(new THREE.Vector3(0, 0.18, 0));
      const sT = new THREE.Vector3(set.setty.x, set.setty.y + 1.7 * set.setty.scale + 0.04, set.setty.z);
      const fc = (o = {}) => shot(cT, { ...set.frames.coach, ...o });
      const fs = (o = {}) => shot(sT, { ...set.frames.setty, ...o });
      const CARD_L = { x: 800, dist: 15 }, CARD_R = { x: 310, dist: 17.5, y: 860 };
      const side = { pos: [-6.5, 2.8, 4.5], at: [0.2, 2.2, -0.8], fov: 36 };
      const high = { pos: [0.6, 10.5, 8.5], at: [0.4, 1.0, -1.2], fov: 42 };
      const back = { pos: [1.0, 1.5, 7.0], at: [-0.6, 2.6, -1.0], fov: 42 };
      const right = { pos: [7.8, 3.4, 3.2], at: [-0.4, 2.2, -0.8], fov: 38 };
      const SHOTS = [
        { shot: set.shots.wide, c: cPose("proud", { armRr: 1.2, armRf: 0.4, elbowR: 0.4, pointR: 1 }), s: sPose("smug"), tag: "", card: null },
        { shot: fc(), c: cPose("hyped", { talk: 0.6, armRr: 1.0, elbowR: 0.6, pointR: 1 }), s: sPose("eyeRoll"), tag: "coach", card: null },
        { shot: fs(), c: cPose("confused"), s: sPose("mocking", { lookX: -0.7 }), tag: "setty", card: null },
        { shot: fc(CARD_L), c: cPose("stressed"), s: sPose("deadpan"), tag: "coach + CARD_L", card: "left" },
        { shot: fs(CARD_R), c: cPose("skeptical"), s: sPose("proud"), tag: "setty + CARD_R", card: "right" },
        { shot: fs(CARD_L), c: cPose("annoyed"), s: sPose("sly"), tag: "setty + CARD_L", card: "left" },
        { shot: fc(CARD_R), c: cPose("panic"), s: sPose("smug"), tag: "coach + CARD_R", card: "right" },
        { shot: side, c: cPose("annoyed", { talk: 0.5 }), s: sPose("deadpan"), tag: "check: side", card: null },
        { shot: high, c: cPose("mocking"), s: sPose("smug"), tag: "check: high", card: null },
        { shot: back, c: cPose("defeated"), s: sPose("laughing"), tag: "check: low", card: null },
        { shot: right, c: cPose("pointing"), s: sPose("happy"), tag: "check: right", card: null },
      ];
      function renderAt(t) {
        const k = Math.min(SHOTS.length - 1, Math.floor(t));
        const S = SHOTS[k], sh = S.shot;
        coach.apply(Object.assign(cBase(), S.c, { x: set.coach.x, y: set.coach.y, z: set.coach.z, sit: 0, phone: 0, turn: set.coach.turn + (S.c.turn || 0) }));
        setty.apply(Object.assign({}, S.s, set.setty, { turn: set.setty.turn + (S.s.turn || 0) }));
        camera.position.set(...sh.pos);
        camera.lookAt(...sh.at);
        camera.fov = sh.fov;
        camera.updateProjectionMatrix();
        renderer.render(scene, camera);
        document.querySelectorAll(".cap").forEach((el, i) => (el.style.opacity = i === k ? 1 : 0));
        const card = document.getElementById("card");
        card.style.opacity = S.card ? 1 : 0;
        card.style.top = `${tb + 24}px`;
        card.style.left = S.card === "left" ? "40px" : "520px";
        document.getElementById("tag").textContent = S.tag;
        document.getElementById("tag").style.opacity = S.tag ? 1 : 0;
      }
      renderAt(0);
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: 11 });
      window.__timelines = window.__timelines || {};
      window.__timelines.boardroom = tl;
    </script>
  </body>
</html>
