<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.module.js",
                     "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.2/examples/jsm/" } }
    </script>
    <style>
      @font-face { font-family: "Nohemi"; font-weight: 600; src: url("assets/fonts/Nohemi-600.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 100 900; src: url("assets/fonts/Inter-var.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #161a26; }
      #root { position: relative; width: 100%; height: 100%; }
      #three { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .hook { position: absolute; left: 20px; right: 20px; top: 250px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
      .hook .l { display: inline-block; background: #fff; color: #121110; font: 800 62px/1.08 Inter, sans-serif; letter-spacing: -0.035em;
        padding: 0.14em 0.36em 0.2em; border-radius: 0.36em; box-shadow: 0 22px 46px -18px rgba(0, 0, 0, 0.8); white-space: nowrap; }
      .hook .l b { color: #ff611d; }
      .cap { position: absolute; left: 80px; right: 80px; top: 1185px; text-align: center; font: 600 96px/1.04 Nohemi, sans-serif;
        letter-spacing: -0.045em; color: #fff; -webkit-text-stroke: 14px #0d0c0a; paint-order: stroke fill; text-shadow: 0 10px 0 #0d0c0a; opacity: 0; }
      .cap b { color: #ff7a3a; font-weight: 600; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="park" data-start="0" data-duration="14" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="three"></canvas>
      <div class="hook"><span class="l">This is the <b>follow-up</b> I send</span><span class="l">when a lead stops replying</span></div>
      <div class="cap" id="c0">You let that lead go <b>cold</b>, right?</div>
      <div class="cap" id="c1">He asked about my <b>program</b>.</div>
      <div class="cap" id="c2">So you <b>followed up</b>?</div>
      <div class="cap" id="c3">And look <b>desperate</b>?</div>
      <div class="cap" id="c4">A few hours later:</div>
      <div class="cap" id="c5">Plug me into <b>Manychat</b>.</div>
      <div class="cap" id="c6">These <b>pigeons</b>…</div>
    </div>
    <script type="module">
      import * as THREE from "three";
      import { createSetty, pose as sPose } from "./assets/setty/setty.js";
      import { createCoach, pose as cPose } from "./assets/coach/coach.js";
      import { build } from "./assets/sets/park.js";
      import { shot as frameShot } from "./assets/sets/kit.js";

      const W = 1080, H = 1920;
      const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("three"), antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(W, H, false);
      renderer.setPixelRatio(1);
      const scene = new THREE.Scene();
      const set = await build({ renderer, scene });
      const coach = createCoach(), setty = createSetty();
      scene.add(coach.root, setty.root);
      const camera = new THREE.PerspectiveCamera(40, W / H, 0.5, 120);
      // dialogue.js: CARD_L = { x: 800, dist: 15 }, CARD_R = { x: 310, dist: 17.5, y: 860 }, yaw nudged ±0.07
      const SHOTS = [
        { cap: 0, shot: "wide", c: cPose("defeated"), s: sPose("smug") },
        { cap: 1, shot: "coach", c: cPose("defeated", { talk: 0.5 }), s: sPose("eyeRoll") },
        { cap: 2, shot: "setty", c: cPose("confused"), s: sPose("deadpan", { lookX: -0.7 }) },
        { cap: 4, shot: "setty", o: { dist: 8.4, yaw: 0.27 }, c: cPose("pleading"), s: sPose("mocking") },
        { cap: 3, shot: "coach", o: { dist: 9.6, yaw: 0.43 }, c: cPose("panic"), s: sPose("smug") },
        { cap: 3, shot: "coach", o: { x: 800, dist: 15, yaw: 0.43 }, c: cPose("annoyed", { talk: 0.5, armRf: 1.0, elbowR: 1.2 }), s: sPose("smug") },
        { cap: 5, shot: "setty", o: { x: 800, dist: 15, yaw: 0.22 }, c: cPose("skeptical"), s: sPose("smug") },
        { cap: 4, shot: "setty", o: { x: 310, dist: 17.5, y: 860, yaw: 0.22 }, c: cPose("thinking"), s: sPose("sly") },
        { cap: 1, shot: "coach", o: { x: 310, dist: 17.5, y: 860, yaw: 0.43 }, c: cPose("skeptical", { talk: 0.4 }), s: sPose("smug") },
        { cap: 6, shot: "pigeons", c: cPose("shocked"), s: sPose("mocking") },
        // QA views (not in the reel): exact side views along the bench (Setty on the rail, the coach on the seat), from
        // the right three-quarter, and from above
        { side: "setty", c: cPose("annoyed"), s: sPose("mocking") },
        { side: "coach", c: cPose("annoyed", { talk: 0.5, armRf: 1.0, elbowR: 1.2, armLf: 0.6 }), s: sPose("smug") },
        { cam: { pos: [7.0, 3.2, 2.0], at: [0.4, 1.8, -1.0], fov: 40 }, c: cPose("panic"), s: sPose("laughing") },
        { cam: { pos: [0.2, 10.5, 3.2], at: [0.1, 1.2, -0.8], fov: 42 }, c: cPose("pleading"), s: sPose("sideEye") },
      ];
      function renderAt(t) {
        const k = Math.min(SHOTS.length - 1, Math.floor(t));
        const S = SHOTS[k], sh = set.shots[S.shot] || S.cam;
        coach.apply(Object.assign({}, S.c, set.coach, { turn: set.coach.turn + (S.c.turn || 0) }));
        setty.apply(Object.assign({}, S.s, set.setty, { turn: set.setty.turn + (S.s.turn || 0), armLr: S.s.armLr > 1 ? S.s.armLr : set.setty.armLr }));
        // aim the close-ups like the engine does: at the real (posed, seated) heads
        scene.updateMatrixWorld(true);
        const v3 = (x = 0, y = 0, z = 0) => new THREE.Vector3(x, y, z);
        const P = set.setty;
        const tgt = { coach: coach.head.getWorldPosition(v3()).add(v3(0, 0.18, 0)),
          setty: v3(P.x, P.y + 1.7 * (P.scale ?? 1) + 0.04, P.z) };
        const f = set.frames[S.shot];
        const dir = v3(Math.cos(0.22), 0, -Math.sin(0.22)); // the bench's long axis (park.js BENCH.ry)
        const sideCam = (p, sgn, y, d) => ({ pos: [p.x + dir.x * d * sgn, y, p.z + dir.z * d * sgn], at: [p.x, y, p.z], fov: 26 });
        const cam = S.side === "setty" ? sideCam(P, 1, 1.9, 9) : S.side === "coach" ? sideCam(set.coach, -1, 1.6, 11)
          : S.cam || (f ? frameShot(tgt[S.shot] || f.target, { ...f, ...(S.o || {}) }) : sh);
        camera.position.set(...cam.pos);
        camera.lookAt(...cam.at);
        camera.fov = cam.fov;
        camera.updateProjectionMatrix();
        renderer.render(scene, camera);
        document.querySelectorAll(".cap").forEach((el, i) => (el.style.opacity = i === S.cap ? 1 : 0));
        document.querySelector(".hook").style.opacity = S.cam || S.side ? 0 : 1;
      }
      renderAt(0);
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: 14 });
      window.__timelines = window.__timelines || {};
      window.__timelines.park = tl;
    </script>
  </body>
</html>
