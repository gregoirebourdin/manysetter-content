<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <script type="importmap">
      { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.181.2/build/three.module.js",
                     "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.181.2/examples/jsm/" } }
    </script>
    <style>
      @font-face { font-family: "Nohemi"; font-weight: 600; src: url("assets/fonts/Nohemi-600.woff2") format("woff2"); }
      @font-face { font-family: "Inter"; font-weight: 100 900; src: url("assets/fonts/Inter-var.woff2") format("woff2"); }
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1080px; height: 1920px; overflow: hidden; background: #161a26; }
      #root { position: relative; width: 100%; height: 100%; }
      #three { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
      .hook { position: absolute; left: 20px; right: 20px; top: 250px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
      .hook .l { display: inline-block; background: #fff; color: #121110; font: 800 64px/1.08 Inter, sans-serif; letter-spacing: -0.035em;
        padding: 0.14em 0.36em 0.2em; border-radius: 0.36em; box-shadow: 0 22px 46px -18px rgba(0, 0, 0, 0.8); white-space: nowrap; }
      .hook .l b { color: #ff611d; }
      .cap { position: absolute; left: 80px; right: 80px; top: 1185px; text-align: center; font: 600 96px/1.04 Nohemi, sans-serif;
        letter-spacing: -0.045em; color: #fff; -webkit-text-stroke: 14px #0d0c0a; paint-order: stroke fill; text-shadow: 0 10px 0 #0d0c0a; opacity: 0; }
      .cap b { color: #ff7a3a; font-weight: 600; }
      .tag { position: absolute; left: 24px; bottom: 24px; font: 600 28px Inter, sans-serif; color: #fff; opacity: 0.6; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="car" data-start="0" data-duration="8" data-fps="30" data-width="1080" data-height="1920">
      <canvas id="three"></canvas>
      <div class="hook"><span class="l">Why you booked <b>10 calls</b> this week</span><span class="l">and closed none of them</span></div>
      <div class="cap" id="c0">You booked <b>10</b> calls this week?</div>
      <div class="cap" id="c1">So booked I'm taking calls from my <b>car.</b></div>
      <div class="cap" id="c2">How many <b>paid</b> you?</div>
      <div class="cap" id="c3">Then how do I know?</div>
      <div class="cap" id="c4">I ask your <b>questions</b> in the DM.</div>
      <div class="cap" id="c5">Bro, I just suck at closing.</div>
      <div class="cap" id="c6">Spoiler, <b>$50.</b></div>
      <div class="cap" id="c7">Comment <b>SETTY</b></div>
      <div class="tag" id="tag"></div>
    </div>
    <script type="module">
      import * as THREE from "three";
      import { createSetty, pose as sPose } from "./assets/setty/setty.js";
      import { createCoach, pose as cPose } from "./assets/coach/coach.js";
      import { shot } from "./assets/sets/kit.js";
      import { build } from "./assets/sets/car.js";

      const W = 1080, H = 1920;
      const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById("three"), antialias: true, preserveDrawingBuffer: true });
      renderer.setSize(W, H, false);
      renderer.setPixelRatio(1);
      const scene = new THREE.Scene();
      const set = await build({ renderer, scene });
      const coach = createCoach(), setty = createSetty();
      scene.add(coach.root, setty.root);
      const camera = new THREE.PerspectiveCamera(40, W / H, 0.5, 120);
      const SKIP_C = new Set(["x", "y", "z", "turn", "scale", "squash", "sit", "spread", "talk"]);
      const SKIP_S = new Set(["x", "y", "z", "turn", "scale"]);
      const faceOf = (p, skip) => Object.fromEntries(Object.entries(p).filter(([k]) => !skip.has(k)));
      const placeC = (c) => coach.apply(Object.assign(cPose("neutral"), set.coach, faceOf(c, SKIP_C), { turn: set.coach.turn + (c.turn || 0) }));
      const placeS = (s) => setty.apply(Object.assign(sPose("happy"), set.setty, faceOf(s, SKIP_S), { turn: set.setty.turn + (s.turn || 0) }));
      // the engine aims the close-ups at the real heads (posed and seated)
      placeC({});
      placeS({});
      scene.updateMatrixWorld(true);
      set.frames.coach.target = coach.head.getWorldPosition(new THREE.Vector3()).add(new THREE.Vector3(0, 0.18, 0));
      const P = set.setty;
      set.frames.setty.target = new THREE.Vector3(P.x, P.y + 1.7 * P.scale + 0.04, P.z);
      const camOf = (name, o = {}) => (name === "wide" ? set.shots.wide : shot(set.frames[name].target, { ...set.frames[name], ...o, fov: 30 }));
      const SHOTS = [
        { tag: "wide (frame 0)", cam: ["wide"], c: cPose("proud", { lookX: -0.5 }), s: sPose("smug", { lookX: 0.8 }) },
        { tag: "coach close-up", cam: ["coach"], c: cPose("hyped", { talk: 0.6, armLr: 0.9, armLf: 1.0, elbowL: 1.3 }), s: sPose("eyeRoll") },
        { tag: "setty close-up", cam: ["setty"], c: cPose("confused"), s: sPose("deadpan", { lookX: 0.7 }) },
        { tag: "coach push-in, card left", cam: ["coach", { x: 800, dist: 15 * 0.9, yaw: -0.37 }], c: cPose("skeptical", { lookX: -0.6 }), s: sPose("sly") },
        { tag: "setty push-in, card right", cam: ["setty", { x: 310, dist: 17.5 * 0.9, y: 860, yaw: 0.39 }], c: cPose("thinking"), s: sPose("sly", { lookX: 0.6 }) },
        { tag: "coach defeated (push 0.8)", cam: ["coach", { dist: 9.6, yaw: -0.37 }], c: cPose("defeated", { nod: 0.06, lookY: -0.15, bend: 0.08 }), s: sPose("sly") },
        { tag: "setty mocking (push 0.8)", cam: ["setty", { dist: 9.2, yaw: 0.39 }], c: cPose("annoyed"), s: sPose("mocking", { armRr: 0.5, armRf: 0.9, armLr: 1.3, armLf: 1.0 }) },
        { tag: "wide, the CTA", cam: ["wide"], c: cPose("laughing"), s: sPose("wink") },
      ];
      function renderAt(t) {
        const k = Math.min(SHOTS.length - 1, Math.floor(t));
        const S = SHOTS[k], sh = camOf(...S.cam);
        placeC(S.c);
        placeS(S.s);
        camera.position.set(...sh.pos);
        camera.lookAt(...sh.at);
        camera.fov = sh.fov;
        camera.updateProjectionMatrix();
        renderer.render(scene, camera);
        document.querySelectorAll(".cap").forEach((el, i) => (el.style.opacity = i === k ? 1 : 0));
        document.getElementById("tag").textContent = S.tag;
      }
      renderAt(0);
      window.addEventListener("hf-seek", (e) => renderAt(e.detail.time));
      const tl = gsap.timeline({ paused: true });
      tl.to({}, { duration: 8 });
      window.__timelines = window.__timelines || {};
      window.__timelines.car = tl;
    </script>
  </body>
</html>
